version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: meeting_summarizer_db
    restart: always
    environment:
      POSTGRES_DB: meetings_db
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: postgres_secure_password_987
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: meeting_summarizer_backend
    restart: always
    environment:
      - DJANGO_SECRET_KEY=django-insecure-production-summarizer-key-val-77
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
      - DB_HOST=db
      - DB_NAME=meetings_db
      - DB_USER=postgres_admin
      - DB_PASSWORD=postgres_secure_password_987
      - DB_PORT=5432
      # Users should replace this with their actual Gemini API Key
      - GEMINI_API_KEY=your_gemini_api_key_here
      # Optional: configure AWS credentials to activate S3 storage
      - AWS_ACCESS_KEY_ID=
      - AWS_SECRET_ACCESS_KEY=
      - AWS_STORAGE_BUCKET_NAME=
      - AWS_S3_REGION_NAME=us-east-1
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    # Automatically execute migrations on container startup and serve django app
    command: sh -c "python manage.py migrate && gunicorn core.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    container_name: meeting_summarizer_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
